name: Deploy telemetry worker

on:
  push:
    branches: [dev]
    paths:
      - "apps/telemetry-worker/**"
      - ".github/workflows/deploy-telemetry-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/telemetry-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/telemetry-worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Worker and D1 integration tests
        run: npm test

      - name: Apply ordered usage migrations
        run: npm run db:migrate:telemetry

      - name: Apply ordered health migrations
        run: npm run db:migrate:health

      - name: Deploy telemetry Worker
        run: npx wrangler deploy
