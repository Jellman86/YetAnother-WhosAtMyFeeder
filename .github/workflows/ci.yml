name: CI
run-name: "${{ github.ref_name }}: ${{ github.event.pull_request.title || github.event_name }}"

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Verify immutable Action references
        run: python backend/scripts/check_action_pins.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python lint
        run: python -m ruff check .

      - name: Python format
        run: python -m ruff format --check .

      - name: Migration smoke test
        run: |
          cd backend
          export DB_PATH=/tmp/yawamf-ci-speciesid.db
          rm -f "$DB_PATH"
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Species catalogue migration smoke test
        run: |
          cd backend
          export SPECIES_CATALOG_PATH=/tmp/yawamf-ci-species-catalog.db
          rm -f "$SPECIES_CATALOG_PATH"
          python -m alembic -c alembic_catalog.ini upgrade head
          python -m alembic -c alembic_catalog.ini downgrade -1
          python -m alembic -c alembic_catalog.ini upgrade head

      - name: Migration path matrix
        run: |
          cd backend
          python scripts/ci_migration_path_check.py

      - name: Backend tests
        run: |
          cd backend
          python scripts/run_regression_gate.py

      - name: Ensure single Alembic head
        run: |
          cd backend
          python - <<'PY'
          import sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          for ini in ("alembic.ini", "alembic_catalog.ini"):
              script = ScriptDirectory.from_config(Config(ini))
              heads = script.get_heads()
              if len(heads) != 1:
                  print(f"{ini}: expected 1 Alembic head, found {len(heads)}: {heads}")
                  sys.exit(1)
              print(f"{ini}: Alembic head OK: {heads[0]}")
          PY

      - name: OpenAPI artifact up to date
        run: |
          cd backend
          python scripts/export_openapi.py --check

      - name: Frontend OpenAPI types up to date
        run: |
          cd backend
          python scripts/export_openapi_types.py --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/ui

      - name: Svelte check
        run: npm run check
        working-directory: apps/ui

      # Dead files and dead packages, the class of rot that survives review (a router
      # nobody mounts, a component nothing renders). Unused exports are not gated yet.
      - name: Dead code (knip)
        run: npm run lint:dead
        working-directory: apps/ui

      # Colour comes from the semantic tokens: no file may add a raw palette class, a dark:
      # colour override or an arbitrary value, and every token pair is proved at WCAG AA.
      - name: Design-token ratchet
        run: npm run lint:tokens
        working-directory: apps/ui

      # The baseline may only fall. The local updater refuses a rise; this catches a hand-edited
      # one by comparing the branch's committed baseline with the one on the branch it targets.
      - name: Design-token baseline does not rise
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run tokens:check-base -- FETCH_HEAD
        working-directory: apps/ui

      - name: Frontend unit tests
        run: npm test
        working-directory: apps/ui

      - name: Build frontend
        run: npm run build
        working-directory: apps/ui

  browser:
    name: Browser regressions (Chromium, part ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    # The whole suite reached 24 of its 25 minutes on one hosted runner, so it runs in two halves.
    # Each half takes about 12 minutes; 25 keeps room for a slow runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser fixtures
        run: npm run test:browser -- --project=chromium --shard=${{ matrix.shard }}/2

      - name: Retain failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: apps/ui/playwright-results
          retention-days: 7

  telemetry-worker:
    name: Telemetry worker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/telemetry-worker/package-lock.json

      - name: Install telemetry worker dependencies
        run: npm ci
        working-directory: apps/telemetry-worker

      - name: Test telemetry worker locally (no Cloudflare deployment)
        run: npm test
        working-directory: apps/telemetry-worker

  docs-compose:
    name: Docs and compose checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Documentation consistency
        run: python3 backend/scripts/docs_consistency_check.py

      - name: Docker Compose config checks
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          bash tests/e2e/monolith_canary_compose_config.sh

  intel-image:
    name: Intel image and motion decoder
    runs-on: ubuntu-latest
    # Pull requests otherwise build no image, so a Dockerfile change was first built after
    # merge. A cold Intel build downloads several runtimes; the dev build's cache usually
    # covers most of them.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the Intel image changed
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF:-dev}"
          if git diff --quiet "$base"...HEAD -- \
              Dockerfile docker/ backend/requirements-base.txt backend/requirements-provider-intel.txt \
              backend/app/services/garden_motion_decode.py tests/e2e/monolith_runtime_flavor_smoke.sh; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The Intel image's inputs are unchanged; the dev build checks it after merge."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the Intel image without publishing it
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            RUNTIME_FLAVOR=intel
          tags: yawamf-monalithic:pr-intel
          cache-from: type=gha,scope=monolith-intel

      - name: Report the Intel image size
        if: steps.scope.outputs.build == 'true'
        run: |
          docker image inspect --format '{{.Size}}' yawamf-monalithic:pr-intel \
            | awk '{ printf "Intel image: %.0f MB uncompressed\n", $1 / 1000000 }'

      - name: Smoke-test the Intel image and its motion decoder
        if: steps.scope.outputs.build == 'true'
        run: tests/e2e/monolith_runtime_flavor_smoke.sh yawamf-monalithic:pr-intel intel
