name: Build and Push Docker Images
run-name: "${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.compute.outputs.backend }}
      frontend: ${{ steps.compute.outputs.frontend }}
      monolith: ${{ steps.compute.outputs.monolith }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine publish scope
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          # Always build both images together so frontend/backend dev tags
          # share the same git hash and are safe to deploy as one versioned pair.
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "monolith=true" >> "$GITHUB_OUTPUT"

  test-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Migration smoke test (fresh DB)
        run: |
          cd backend
          export DB_PATH=/tmp/ci-speciesid.db
          rm -f "$DB_PATH"
          python -m alembic upgrade head

      - name: Migration idempotency check
        run: |
          cd backend
          export DB_PATH=/tmp/ci-speciesid.db
          python -m alembic upgrade head

      - name: Migration downgrade/upgrade check
        run: |
          cd backend
          export DB_PATH=/tmp/ci-speciesid.db
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Migration upgrade path matrix (sampled revisions)
        run: |
          cd backend
          python scripts/ci_migration_path_check.py

      - name: SQLite schema sanity checks (FKs + integrity)
        run: |
          cd backend
          export DB_PATH=/tmp/ci-speciesid.db
          python - <<'PY'
          import sqlite3
          import sys
          import os

          db_path = os.environ["DB_PATH"]
          conn = sqlite3.connect(db_path)
          try:
            conn.execute("PRAGMA foreign_keys=ON;")

            # Basic health checks
            fk_enabled = conn.execute("PRAGMA foreign_keys;").fetchone()[0]
            if fk_enabled != 1:
              print("foreign_keys pragma is not enabled")
              sys.exit(1)

            integrity = conn.execute("PRAGMA integrity_check;").fetchone()[0]
            if integrity != "ok":
              print("integrity_check failed:", integrity)
              sys.exit(1)

            # Detect FK violations (also catches many bad constraints)
            fk_violations = conn.execute("PRAGMA foreign_key_check;").fetchall()
            if fk_violations:
              print("foreign_key_check violations:", fk_violations[:20])
              sys.exit(1)

            # Regression guard: taxonomy_translations must NOT have an FK to taxonomy_cache.taxa_id
            # (it caused sqlite3.OperationalError: foreign key mismatch on upgraded DBs).
            fk_list = conn.execute("PRAGMA foreign_key_list(taxonomy_translations);").fetchall()
            if fk_list:
              print("taxonomy_translations has unexpected foreign keys:", fk_list)
              sys.exit(1)

            # Smoke-write: this would have thrown OperationalError with the old FK mismatch.
            conn.execute(
              "INSERT OR REPLACE INTO taxonomy_translations (taxa_id, language_code, common_name) VALUES (?, ?, ?)",
              (123456, "ru", "test-name"),
            )
            conn.commit()
          finally:
            conn.close()
          print("SQLite sanity checks OK:", db_path)
          PY

      - name: Backend startup/shutdown smoke test
        run: |
          cd backend
          timeout 180s python - <<'PY'
          import asyncio
          import os
          import tempfile
          from pathlib import Path

          import httpx

          temp_dir = tempfile.mkdtemp(prefix="yawamf_ci_startup_")
          os.environ["MEDIA_CACHE_DIR"] = str(Path(temp_dir) / "media_cache")
          os.environ["DATA_DIR"] = str(Path(temp_dir) / "data")
          os.environ["CONFIG_DIR"] = str(Path(temp_dir) / "config")
          os.environ["CONFIG_FILE"] = str(Path(temp_dir) / "config" / "config.json")
          os.environ["DB_PATH"] = str(Path(temp_dir) / "speciesid.db")

          Path(os.environ["MEDIA_CACHE_DIR"]).mkdir(parents=True, exist_ok=True)
          Path(os.environ["DATA_DIR"]).mkdir(parents=True, exist_ok=True)
          Path(os.environ["CONFIG_DIR"]).mkdir(parents=True, exist_ok=True)

          from app.main import app, lifespan

          async def smoke():
              async with lifespan(app):
                  assert hasattr(app.state, "startup_warnings")
                  assert isinstance(app.state.startup_warnings, list)
                  transport = httpx.ASGITransport(app=app)
                  async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                      health = await client.get("/health")
                      assert health.status_code == 200, health.text
                      ready = await client.get("/ready")
                      assert ready.status_code == 200, ready.text
                      body = ready.json()
                      assert body.get("ready") is True, body

          asyncio.run(smoke())
          print("Startup/shutdown smoke test OK")
          PY
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "Backend startup/shutdown smoke test timed out after 180s"
            exit 1
          fi
          exit $rc

      - name: Run tests
        run: |
          cd backend
          LOG_FILE=/tmp/backend-tests.log
          # A hang detector, not a runtime budget: the suite passed 2,556
          # tests and was killed mid-file at 240s after a day of added
          # coverage. Generous enough that only a real hang trips it.
          TEST_TIMEOUT_SECONDS=480
          HEARTBEAT_INTERVAL_SECONDS=30
          SUMMARY_GRACE_SECONDS=12
          MONITOR_INTERVAL_SECONDS=2
          : > "$LOG_FILE"
          set +e

          started_at=$(date +%s)
          (
            while true; do
              sleep "$HEARTBEAT_INTERVAL_SECONDS"
              now=$(date +%s)
              elapsed=$((now - started_at))
              echo "[backend-tests] still running (${elapsed}s elapsed)"
            done
          ) &
          heartbeat_pid=$!

          export LOG_FILE TEST_TIMEOUT_SECONDS
          RUNNER_SCRIPT=/tmp/run_backend_tests_ci.sh
          cat > "$RUNNER_SCRIPT" <<'SH'
          #!/usr/bin/env bash
          set -o pipefail
          timeout -k 30s "${TEST_TIMEOUT_SECONDS}s" bash -lc '
            python -m coverage erase &&
            python -m coverage run -m pytest tests/ -v --tb=short --durations=20 &&
            python -m coverage report --fail-under=20
          ' 2>&1 | tee "$LOG_FILE"
          SH
          chmod +x "$RUNNER_SCRIPT"

          # Run test pipeline in its own process group so we can terminate hung teardown quickly.
          setsid "$RUNNER_SCRIPT" &
          runner_pid=$!

          summary_state=""
          summary_seen_at=0

          while kill -0 "$runner_pid" >/dev/null 2>&1; do
            now=$(date +%s)
            summary_line=$(grep -E "^={6,}.*={6,}$" "$LOG_FILE" | tail -n 1 || true)
            if [ -z "$summary_state" ]; then
              if [ -n "$summary_line" ] && echo "$summary_line" | grep -Eq "([0-9]+ failed|[0-9]+ error|[0-9]+ errors)"; then
                summary_state="failed"
                summary_seen_at=$now
                echo "Detected pytest failure summary; allowing ${SUMMARY_GRACE_SECONDS}s for graceful teardown."
              elif [ -n "$summary_line" ] && echo "$summary_line" | grep -Eq "[0-9]+ passed"; then
                summary_state="passed"
                summary_seen_at=$now
                echo "Detected pytest pass summary; allowing ${SUMMARY_GRACE_SECONDS}s for graceful teardown."
              fi
            elif [ "$summary_state" = "passed" ] && [ -n "$summary_line" ] && echo "$summary_line" | grep -Eq "([0-9]+ failed|[0-9]+ error|[0-9]+ errors)"; then
              summary_state="failed"
              summary_seen_at=$now
              echo "Detected pytest failure markers after initial pass signal; switching to failure state."
            elif [ $((now - summary_seen_at)) -ge "$SUMMARY_GRACE_SECONDS" ]; then
              echo "Runner still active ${SUMMARY_GRACE_SECONDS}s after pytest ${summary_state} summary; terminating stuck teardown."
              kill -TERM -- "-$runner_pid" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL -- "-$runner_pid" >/dev/null 2>&1 || true
              break
            fi
            sleep "$MONITOR_INTERVAL_SECONDS"
          done

          wait "$runner_pid"
          rc=$?

          kill "$heartbeat_pid" >/dev/null 2>&1 || true
          wait "$heartbeat_pid" 2>/dev/null || true
          rm -f "$RUNNER_SCRIPT"
          set -e

          # Known CI issue: process can hang after pytest printed final summary.
          # If pytest reported pass, always re-check coverage gate from saved data.
          if [ "$summary_state" = "passed" ]; then
            echo "Validating coverage gate after pytest pass summary."
            if python -m coverage report --fail-under=20; then
              echo "Coverage gate passed."
              exit 0
            fi
            echo "Coverage gate failed after pytest pass summary."
            exit 1
          fi

          if [ "$summary_state" = "failed" ]; then
            echo "Backend tests reported failures."
            echo "Last 200 log lines:"
            tail -n 200 "$LOG_FILE" || true
            exit 1
          fi

          if [ $rc -eq 124 ]; then
            echo "Backend pytest timed out after ${TEST_TIMEOUT_SECONDS}s."
            echo "Last 200 log lines:"
            tail -n 200 "$LOG_FILE" || true
            echo "Runner process snapshot:"
            ps -eo pid,ppid,stat,etime,cmd | head -n 120 || true
            exit 1
          fi
          exit $rc

      - name: Ensure single Alembic head
        run: |
          cd backend
          python - <<'PY'
          import sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          if len(heads) != 1:
              print(f"Expected 1 Alembic head, found {len(heads)}: {heads}")
              sys.exit(1)
          print(f"Alembic head OK: {heads[0]}")
          PY

  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/ui
          npm ci

      - name: Svelte check
        run: |
          cd apps/ui
          npm run check

      - name: Frontend unit tests
        run: |
          cd apps/ui
          npm test

      - name: Build frontend
        run: |
          cd apps/ui
          npm run build

  test-monolith:
    needs: [detect-changes, test-backend, test-frontend]
    if: needs.detect-changes.outputs.monolith == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify monolith canary compose config
        run: |
          bash tests/e2e/monolith_canary_compose_config.sh

      - name: Verify inference runtime flavor contract
        run: |
          bash tests/e2e/runtime_flavor_contract.sh

      - name: Build and smoke test monolithic image
        run: |
          bash tests/e2e/monolith_smoke.sh
          bash tests/e2e/monolith_nonroot_smoke.sh

  build-backend:
    needs: [detect-changes, test-backend]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Prefer tag version for releases (strip leading 'v')
            echo "APP_VERSION_BASE=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION_BASE=$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Get branch and SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Avoid embedding tag name into APP_VERSION (it already encodes the version)
            echo "APP_BRANCH=stable" >> $GITHUB_ENV
          else
            echo "APP_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Determine image tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_HASH=${{ env.SHORT_SHA }}
            APP_VERSION_BASE=${{ env.APP_VERSION_BASE }}
            APP_BRANCH=${{ env.APP_BRANCH }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/wamf-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/wamf-backend:${{ github.sha }}
      - name: Tag backend latest
        if: env.PUBLISH_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/wamf-backend:latest \
            ghcr.io/${{ env.OWNER_LC }}/wamf-backend:${{ env.IMAGE_TAG }}

  build-frontend:
    needs: [detect-changes, test-frontend]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Prefer tag version for releases (strip leading 'v')
            echo "APP_VERSION_BASE=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION_BASE=$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Get branch and SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Avoid embedding tag name into APP_VERSION (it already encodes the version)
            echo "APP_BRANCH=stable" >> $GITHUB_ENV
          else
            echo "APP_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Determine image tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./apps/ui
          push: true
          build-args: |
            GIT_HASH=${{ env.SHORT_SHA }}
            APP_VERSION_BASE=${{ env.APP_VERSION_BASE }}
            APP_BRANCH=${{ env.APP_BRANCH }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/wamf-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/wamf-frontend:${{ github.sha }}
      - name: Tag frontend latest
        if: env.PUBLISH_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/wamf-frontend:latest \
            ghcr.io/${{ env.OWNER_LC }}/wamf-frontend:${{ env.IMAGE_TAG }}

  build-monolith:
    needs: [detect-changes, test-backend, test-frontend, test-monolith]
    if: needs.detect-changes.outputs.monolith == 'true'
    runs-on: ubuntu-latest
    # A hosted runner can occasionally stall before Buildx is ready. Keep that
    # failure bounded so an incomplete flavor family can never occupy a release
    # run for GitHub's six-hour default; promotion already fails closed unless
    # every flavor builds and starts successfully.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            suffix: ""
            # The combined CUDA + OpenVINO image has multi-gigabyte runtime
            # layers. Exporting those layers to the GHA cache can outlive the
            # image push and consume the entire bounded job, preventing its
            # smoke test and the fail-closed promotion stage from running.
            # It may still consume a previous cache; only the costly export is
            # disabled for this compatibility flavor.
            cache_export: ""
          - flavor: cpu
            suffix: "-cpu"
            cache_export: type=gha,mode=max,scope=monolith-cpu
          - flavor: intel
            suffix: "-intel"
            cache_export: type=gha,mode=max,scope=monolith-intel
          - flavor: cuda
            suffix: "-cuda"
            cache_export: type=gha,mode=max,scope=monolith-cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # The GitHub Actions cache backend is unavailable with Buildx's default
      # Docker driver. Give every flavor job an isolated docker-container
      # builder before enabling the per-flavor GHA cache below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_VERSION_BASE=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION_BASE=$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Get branch and SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_BRANCH=stable" >> $GITHUB_ENV
          else
            echo "APP_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Build and push monolithic canary image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_HASH=${{ env.SHORT_SHA }}
            APP_VERSION_BASE=${{ env.APP_VERSION_BASE }}
            APP_BRANCH=${{ env.APP_BRANCH }}
            RUNTIME_FLAVOR=${{ matrix.flavor }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${{ github.sha }}${{ matrix.suffix }}
          cache-from: type=gha,scope=monolith-${{ matrix.flavor }}
          cache-to: ${{ matrix.cache_export }}

      - name: Smoke-test ${{ matrix.flavor }} image without an accelerator
        run: |
          tests/e2e/monolith_runtime_flavor_smoke.sh \
            "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${{ github.sha }}${{ matrix.suffix }}" \
            "${{ matrix.flavor }}"

  build-monolith-rpi:
    needs: [detect-changes, test-backend, test-frontend, test-monolith]
    if: needs.detect-changes.outputs.monolith == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_VERSION_BASE=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION_BASE=$(cat VERSION)" >> $GITHUB_ENV
          fi

      - name: Get branch and SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "APP_BRANCH=stable" >> $GITHUB_ENV
          else
            echo "APP_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Determine image tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Build and push Raspberry Pi canary image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            GIT_HASH=${{ env.SHORT_SHA }}
            APP_VERSION_BASE=${{ env.APP_VERSION_BASE }}
            APP_BRANCH=${{ env.APP_BRANCH }}
            RUNTIME_FLAVOR=rpi
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:${{ github.sha }}

      - name: Smoke-test Raspberry Pi image
        run: |
          tests/e2e/monolith_runtime_flavor_smoke.sh \
            "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:${{ github.sha }}" \
            "rpi" \
            "linux/arm64"

      - name: Promote Raspberry Pi monolithic tag
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:${{ env.IMAGE_TAG }} \
            ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:${{ github.sha }}

      - name: Tag Raspberry Pi monolithic latest
        if: env.PUBLISH_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:latest \
            ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic-rpi:${{ github.sha }}

  verify-monolith-flavor-switch:
    name: Verify full ↔ CPU persistent-state switching
    needs: [build-monolith]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch full to CPU and back with shared persistent state
        run: |
          tests/e2e/monolith_runtime_flavor_switch.sh \
            "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${{ github.sha }}" \
            "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${{ github.sha }}-cpu" \
            cpu

  promote-monolith-flavors:
    name: Promote verified monolith flavor tags
    needs: [verify-monolith-flavor-switch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine verified channel tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Verify every immutable flavor manifest exists
        run: |
          set -euo pipefail
          for suffix in "" -cpu -intel -cuda; do
            docker buildx imagetools inspect \
              "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${GITHUB_SHA}${suffix}" >/dev/null
          done

      - name: Promote the verified flavor family
        run: |
          set -euo pipefail
          for suffix in "" -cpu -intel -cuda; do
            source="ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${GITHUB_SHA}${suffix}"
            docker buildx imagetools create \
              -t "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:${IMAGE_TAG}${suffix}" \
              "$source"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              docker buildx imagetools create \
                -t "ghcr.io/${{ env.OWNER_LC }}/yawamf-monalithic:latest${suffix}" \
                "$source"
            fi
          done

  # Record the version that was just built so the in-app update prompt is authoritative.
  # Writes one row per built branch plus the latest release row to the telemetry worker's D1
  # (read by GET /version). No-ops without the Cloudflare secret.
  publish-version:
    name: Publish version to update endpoint
    runs-on: ubuntu-latest
    needs: [promote-monolith-flavors]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      # Only the API token is needed: wrangler infers the (single) account it belongs to.
      # We deliberately do NOT pass CLOUDFLARE_ACCOUNT_ID — a stale/mismatched account-id
      # secret makes the D1 API reject the request with "account not authorized" (7403)
      # even when the token is valid, so inference from the token is the robust path.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/telemetry-worker/package-lock.json

      - name: Install worker dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/telemetry-worker
        run: npm ci

      - name: Publish version to D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/telemetry-worker
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}"
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            CHANNEL="${{ github.ref_name }}"
            VERSION="$(tr -d '[:space:]' < ../../VERSION)"
            COMMIT="${{ github.sha }}"
            URL="$REPO_URL/tree/${{ github.ref_name }}"
          else
            CHANNEL="stable"
            VERSION="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
            URL="$REPO_URL/releases/tag/${{ github.ref_name }}"
          fi
          echo "Publishing $CHANNEL version=$VERSION commit=$COMMIT"
          # Best-effort: a failed publish (e.g. a Cloudflare token/permission problem)
          # must not fail image publishing, but it does leave the D1 source of truth stale.
          # Warn loudly so the secret/scope can be fixed.
          if npx wrangler d1 execute yawamf-telemetry --remote --yes --command \
            "CREATE TABLE IF NOT EXISTS app_versions (channel TEXT PRIMARY KEY, version TEXT, commit_sha TEXT, url TEXT, updated_at TEXT); INSERT OR REPLACE INTO app_versions (channel, version, commit_sha, url, updated_at) VALUES ('$CHANNEL', '$VERSION', '$COMMIT', '$URL', datetime('now'));"; then
            echo "Published $CHANNEL version to D1."
          else
            echo "::warning title=Version publish skipped::Could not publish the $CHANNEL version to D1 (Cloudflare API not authorized — check the CLOUDFLARE_API_TOKEN secret's D1 scope). Update prompts use D1 as their source of truth, so this channel will remain at the previously published version until the publish succeeds."
          fi
