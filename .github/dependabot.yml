version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    target-branch: "dev"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # onnxruntime-gpu 1.27+ ships CUDA 13 userspace, which needs the NVIDIA 580 driver
      # series on every CUDA host. Lifting the window is a 3.0 breaking change (ROADMAP
      # 1.7), not a dependency bump; the pin lives in requirements-provider-{cuda,full}.txt.
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.27.0"]

  - package-ecosystem: npm
    directory: "/apps/ui"
    schedule:
      interval: weekly
    target-branch: "dev"
    groups:
      ui-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/telemetry-worker"
    schedule:
      interval: weekly
    target-branch: "dev"
    groups:
      telemetry-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "dev"
    ignore:
      # Node ships odd-numbered majors as Current only; they never become LTS.
      # Node 25 reached end of life on 2026-03-31. Track LTS lines deliberately.
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x", "29.x"]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    target-branch: "dev"
    ignore:
      # Node ships odd-numbered majors as Current only; they never become LTS.
      # Node 25 reached end of life on 2026-03-31. Track LTS lines deliberately.
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x", "29.x"]

  - package-ecosystem: docker
    directory: "/apps/ui"
    schedule:
      interval: weekly
    target-branch: "dev"
    ignore:
      # Node ships odd-numbered majors as Current only; they never become LTS.
      # Node 25 reached end of life on 2026-03-31. Track LTS lines deliberately.
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x", "29.x"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "dev"
    groups:
      github-actions:
        patterns: ["*"]
