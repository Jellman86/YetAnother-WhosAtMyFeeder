<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=20260306-1" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=20260306-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260306-1" />
    <link rel="manifest" href="/manifest.json?v=20260306-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="description" content="Bird detection and classification for your backyard feeder" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = storedTheme === 'dark' || ((storedTheme === 'system' || !storedTheme) && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          // Accessibility chosen on this device (accessibility-device.svelte.ts holds the same
          // entry), applied before the first paint so the page never shows another look first.
          let device = {};
          try {
            const parsed = JSON.parse(localStorage.getItem('accessibility_device') || '{}');
            if (parsed && typeof parsed === 'object') device = parsed;
          } catch {
            device = {};
          }
          const root = document.documentElement;
          const highContrast = device.highContrast === true;
          if (highContrast) root.classList.add('high-contrast', 'dark');
          if (device.dyslexiaFont === true) root.classList.add('font-dyslexic');
          if (device.reducedMotion === true) root.classList.add('reduced-motion');
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', highContrast ? '#000000' : isDark ? '#030712' : '#f8fafc');
          }
        } catch {
          // Ignore startup theme-read failures and continue with defaults.
        }
      })();
    </script>
    <title>Yet Another WhosAtMyFeeder</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
